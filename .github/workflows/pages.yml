name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/history.csv", "data/status.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the daily run's data commit, not the commit that triggered the run
      - name: Assemble site and data files
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/history.csv data/status.json _site/data/ 2>/dev/null || echo "no data yet"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
